name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then
            ext=".exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/dizee-${GOOS}-${GOARCH}${ext}" ./cmd/dizee
      - name: Smoke-test Linux amd64
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          bin=dist/dizee-linux-amd64
          test "$(printf '{\n  \"a\": 1\n}\n' | "$bin" -stats=false)" = '{"a":1}'
          log_out=$(printf 'INFO retry with diagnostic context\n%.0s' {1..4} | "$bin" -stats=false)
          printf '%s\n' "$log_out" | grep -q '^\[dizee:[0-9a-f]\{64\}\]$'
          printf '%s\n' "$log_out" | grep -q '^INFO retry with diagnostic context \[x4\]$'
          test "$(printf 'a  \n\n\n\nb\t\n' | "$bin" -stats=false)" = $'a\n\nb'
      - uses: actions/upload-artifact@v4
        with:
          name: dizee-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum dizee-* > SHA256SUMS
      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
